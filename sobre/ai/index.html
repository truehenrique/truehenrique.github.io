      <style>
        [x-cloak] {
          display: none !important;
        }

        .ai-chat {
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }

        .ai-chat h2 {
          margin-bottom: 0;
        }

        .no-padding {
          padding: 0;
        }

        .no-margin {
          margin: 0;
        }

        /* Área de conversa: tamanho fixo com scrollbar */
        .chat-result-area {
          height: 420px;
          overflow-y: auto;
          padding: 1rem;
          background-color: #fafafa;
          border: 1px solid #e0e0e0;
          border-radius: 8px;
        }

        .chat-result-area:focus {
          outline: 1px solid #0074d9;
          outline-offset: 1px;
        }

        .chat-message {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          margin-bottom: 1rem;
        }

        .chat-message:last-child {
          margin-bottom: 0;
        }

        .chat-bubble {
          max-width: 85%;
          padding: 0.6rem 0.9rem;
          border-radius: 12px;
        }

        .chat-bubble p {
          margin: 0;
          white-space: pre-wrap;
          overflow-wrap: anywhere;
        }

        .chat-bubble-user {
          align-self: flex-end;
          background-color: #0074d9;
          color: #fff;
          border-bottom-right-radius: 4px;
        }

        .chat-bubble-ai {
          align-self: flex-start;
          background-color: #ececec;
          color: #111;
          border-bottom-left-radius: 4px;
        }

        /* Loading em três pontinhos */
        .chat-loading {
          display: flex;
          align-items: center;
          gap: 0.3rem;
          padding: 0.25rem 0;
        }

        .chat-loading-dot {
          width: 0.5rem;
          height: 0.5rem;
          border-radius: 50%;
          background-color: #777;
          animation: chat-loading-bounce 1.2s infinite ease-in-out;
        }

        .chat-loading-dot:nth-child(2) {
          animation-delay: 0.15s;
        }

        .chat-loading-dot:nth-child(3) {
          animation-delay: 0.3s;
        }

        @keyframes chat-loading-bounce {
          0%, 80%, 100% {
            transform: scale(0.6);
            opacity: 0.4;
          }
          40% {
            transform: scale(1);
            opacity: 1;
          }
        }

        .chat-error {
          font-style: italic;
        }

        .chat-form {
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
        }

        .chat-input {
          min-height: 5rem;
          resize: vertical;
          font-family: inherit;
        }

        .chat-actions {
          display: flex;
          justify-content: flex-end;
        }

        .chat-submit {
          margin: 0;
        }

        .chat-submit[disabled] {
          opacity: 0.6;
          cursor: not-allowed;
        }

        body.dark .chat-result-area {
          background-color: #111;
          border-color: #333;
        }

        body.dark .chat-bubble-ai {
          background-color: #2a2a2a;
          color: #fff;
        }

        body.dark .chat-loading-dot {
          background-color: #ccc;
        }
      </style>
      <script>
        function aiChat() {
          // Vercel Function que recebe { message } e responde { reply }.
          const AI_API_URL = 'https://truehenrique.vercel.app/api/chat';
          const AI_API_TIMEOUT = 45000;

          // Envia a pergunta e resolve com o texto da resposta.
          function askAi(question) {
            const controller = new AbortController();
            const timeoutId = setTimeout(function () {
              controller.abort();
            }, AI_API_TIMEOUT);

            return fetch(AI_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: question }),
              signal: controller.signal
            })
              .then(function (response) {
                if (!response.ok) {
                  throw new Error('AI API respondeu com status ' + response.status);
                }

                return response.json();
              })
              .then(function (data) {
                if (!data || typeof data.reply !== 'string' || !data.reply.trim()) {
                  throw new Error('AI API retornou uma resposta inválida');
                }

                return data.reply;
              })
              .catch(function (error) {
                if (error.name === 'AbortError') {
                  throw new Error('AI API demorou demais para responder');
                }

                throw error;
              })
              .finally(function () {
                clearTimeout(timeoutId);
              });
          }

          return {
            question: '',
            messages: [],

            // Sempre mantém a conversa rolada para o final. O MutationObserver
            // reage depois que a resposta (ou o loading) é renderizada no DOM.
            observeResultArea: function (area) {
              if (!area || typeof MutationObserver === 'undefined') return;

              this.resultAreaObserver = new MutationObserver(function () {
                area.scrollTop = area.scrollHeight;
              });

              this.resultAreaObserver.observe(area, {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true,
                attributeFilter: ['style']
              });
            },

            send: function () {
              const question = this.question.trim();
              if (!question) return;

              this.question = '';
              this.messages.push({
                question: question,
                status: 'loading',
                answer: ''
              });

              const message = this.messages[this.messages.length - 1];

              askAi(question)
                .then(function (answer) {
                  message.answer = answer;
                  message.status = 'done';
                })
                .catch(function (error) {
                  console.error('AI API error:', error);
                  message.status = 'error';
                });
            },

            destroy: function () {
              if (this.resultAreaObserver) this.resultAreaObserver.disconnect();
            }
          };
        }
      </script>

    <main role="main" class="flex full wrap about">
  <div class="section">
    <div class="wwrap ai-chat" x-data="aiChat()">
      <img src="/images/avatar.png" class="no-margin no-padding" alt="" />
      <h3 class="no-margin no-padding">Pergunte sobre minhas experiências e vida profissional</h3>

      <div id="result-area"
           class="chat-result-area"
           x-ref="resultArea"
           x-show="messages.length > 0"
           x-cloak
           x-init="observeResultArea($el)"
           role="log"
           aria-live="polite"
           aria-label="Conversa"
           tabindex="0">
        <template x-for="(message, index) in messages" :key="index">
          <div class="chat-message">
            <div class="chat-bubble chat-bubble-user">
              <p x-text="message.question"></p>
            </div>

            <div class="chat-bubble chat-bubble-ai">
              <div class="chat-loading"
                   x-show="message.status === 'loading'"
                   role="status"
                   aria-label="Aguardando resposta">
                <span class="chat-loading-dot"></span>
                <span class="chat-loading-dot"></span>
                <span class="chat-loading-dot"></span>
              </div>

              <p class="chat-error"
                 x-show="message.status === 'error'"
                 x-text="'A API está fora do ar. Tente novamente em instantes.'">
              </p>

              <p class="chat-answer"
                 x-show="message.status === 'done'"
                 x-text="message.answer"></p>
            </div>
          </div>
        </template>
      </div>

      <form class="chat-form" x-on:submit.prevent="send">
        <textarea class="chat-input"
                  x-model="question"
                  x-ref="questionInput"
                  x-on:keydown.enter.exact.prevent="send"
                  rows="3"
                  placeholder="Escreva sua pergunta... (ex:. Qual a sua linguagem preferida?)"
                  aria-label="Sua pergunta"></textarea>

        <div class="chat-actions">
          <button type="submit"
                  class="button chat-submit"
                  :disabled="question.trim() === ''">
            Enviar
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
